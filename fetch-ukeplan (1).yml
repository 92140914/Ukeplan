name: Hent Ukeplan 8E

on:
  # Kjør hver mandag morgen kl. 07:00
  schedule:
    - cron: '0 7 * * 1'
  
  # Tillat manuell kjøring
  workflow_dispatch:
  
  # Kjør når det pushes til main
  push:
    branches:
      - main

jobs:
  fetch-ukeplan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Sjekk ut repository
      uses: actions/checkout@v4
    
    - name: Sett opp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Installer avhengigheter
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Hent ukeplan
      run: |
        python fetch_8E_plan.py
    
    - name: Sjekk om det er endringer
      id: check_changes
      run: |
        if [ -f ukeplan-8E.json ]; then
          git diff --exit-code ukeplan-8E.json > /dev/null || echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit og push endringer
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git add ukeplan-8E.json
        git commit -m "Oppdater ukeplan 8E - $(date +'%Y-%m-%d %H:%M')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Last opp artefakt
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ukeplan-8E
        path: ukeplan-8E.json
        retention-days: 90
    
    - name: Send notifikasjon ved feil
      if: failure()
      run: |
        echo "❌ Kunne ikke hente ukeplan. Sjekk loggene for detaljer."
        exit 1
