name: Hent ukeplan 8E

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  hent:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Kjør fetch script
        run: |
          python fetch_8E_plan.py

      - name: Commit ukeplan
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Oppdater ukeplan-8E.json
          file_pattern: ukeplan-8E.json
