name: Hent Ukeplan 8E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-5'  # kjør hver ukedag kl 18:00

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer dependencies
        run: pip install -r requirements.txt

      - name: Kjør fetch script
        run: python fetch_8E_plan.py

      - name: Commit JSON
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Oppdater ukeplan-8E.json
          file_pattern: 'ukeplan-8E.json'
          branch: main
