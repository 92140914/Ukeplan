name: Hent ukeplan 8E

on:
  schedule:
    - cron: "0 5 * * 1"   # Hver mandag kl 05:00 UTC
  workflow_dispatch:      # Lar deg kjøre manuelt

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Sjekk ut repo
        uses: actions/checkout@v4

      - name: 🐍 Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installer avhengigheter
        run: |
          pip install -r requirements.txt

      - name: 🌐 Installer Chrome
        uses: browser-actions/setup-chrome@v1

      - name: ▶️ Kjør script
        run: python fetch_8E_plan.py

      - name: 💾 Commit oppdatert JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ukeplan-8E.json
          git commit -m "Oppdatert ukeplan 8E" || echo "Ingen endringer"
          git push
