name: Hent Ukeplan

on:
  schedule:
    - cron: '0 4,6 * * 6,1,2,4,1,0' 
  workflow_dispatch:

jobs:
  fetch-ukeplan:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v3

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Kjør fetch skript
        run: python fetch_8E_plan.py

      - name: Commit og push JSON
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Oppdater ukeplan-8E.json
          file_pattern: ukeplan-8E.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          # Må ha GITHUB_TOKEN med push-tilgang
