      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Hent ukeplan for 8E
